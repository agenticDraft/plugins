kind: provider
role: scm
operations:
  create_branch: create-branch
  publish_change: publish-change
  check_status: check-status
unsupported: []
scripts:
  check_status: "skills/check-status/scripts/check-status.sh"
env:
  - name: GH_TOKEN
    source: "a GitHub fine-grained personal access token whose resource owner owns this repository, with access to it and Pull requests: read and write (github.com/settings/personal-access-tokens); set it only where nobody can log in, because gh prefers it to a login"
    login_alternative: "gh auth login"
hosts: ["api.github.com"]
ignore_paths: [".ai/scm/"]
credential_checks:
  - check: repository-access
    probe: [bash, <pack>/scripts/check-repository-access.sh]
    proves: "gh's login or GH_TOKEN reaches the repository origin names, and the account may push to it; not that a fine-grained token has Pull requests: write, which GitHub does not report"
    remedy: "run gh auth login, or give GH_TOKEN this repository's owner as resource owner, access to this repository, and Contents and Pull requests: read and write (github.com/settings/personal-access-tokens)"

kind: platform
stages:
  - id: intake
    skill: eds-intake
  - id: readiness
    skill: eds-readiness
  - id: extract
    skill: eds-extract
    when:
      - { design_source: true }
      - { design_mentioned: true }
  - id: conventions
    skill: eds-conventions
  - id: serve
    skill: eds-serve
  - id: baseline
    skill: eds-baseline
    when:
      - { components: present }
  - id: prototype
    skill: eds-prototype
    when:
      - { design_source: true }
      - { design_mentioned: true }
  - id: verify-design
    skill: eds-verify-design
    when:
      - { design_source: true }
      - { design_mentioned: true }
    fix_attempts: 2
  - id: plan
    skill: eds-plan
    fix_attempts: 1
  - id: plan-gate
    skill: eds-plan-gate
  - id: implement
    skill: eds-implement
  - id: verify
    skill: eds-verify
  - id: lint
    skill: eds-lint
    fix_attempts: 3
  - id: publish-gate
    skill: eds-publish-gate
  - id: deliver
    skill: eds-deliver
always_autonomous: []
readiness_criteria:
  Story:
    require: [has_description, has_acceptance_criteria, reproduction_content_ok]
  Bug:
    require: [has_description, has_reproduction_url, has_reproduction_steps, reproduction_content_ok]
  Task:
    require: [has_description, has_acceptance_criteria, reproduction_content_ok]
artifacts:
  - id: fact-record
    produced_by: intake
    path: ".ai/run-context/fact-record.yaml"
  - id: sanitized-spec
    produced_by: intake
    path: ".ai/run-context/sanitized-spec.md"
  - id: plan
    produced_by: plan
    path: ".ai/run-context/plan.yaml"
  - id: baseline-capture
    produced_by: baseline
    path: ".ai/run-context/baseline-capture.json"
  - id: design-reference
    produced_by: extract
    path: ".ai/run-context/design-reference.json"
  - id: design-conventions
    produced_by: conventions
    path: ".ai/run-context/design-conventions.md"
  - id: prototype-report
    produced_by: prototype
    path: ".ai/run-context/prototype-report.md"
  - id: design-context-values
    produced_by: prototype
    path: ".ai/run-context/design-context-values.tsv"
  - id: design-context-notes
    produced_by: prototype
    path: ".ai/run-context/design-context-notes.txt"
  - id: verify-design-report
    produced_by: verify-design
    path: ".ai/run-context/verify-design-report.md"
  - id: serve-report
    produced_by: serve
    path: ".ai/run-context/serve-report.md"
  - id: verify-report
    produced_by: verify
    path: ".ai/run-context/verify-report.md"
  - id: evidence-manifest
    produced_by: verify
    path: ".ai/run-context/evidence-manifest.json"
  - id: lint-report
    produced_by: lint
    path: ".ai/run-context/lint-report.md"
  - id: plan-gate-report
    produced_by: plan-gate
    path: ".ai/run-context/plan-gate-report.md"
  - id: publish-gate-report
    produced_by: publish-gate
    path: ".ai/run-context/publish-gate-report.md"
  - id: delivery-report
    produced_by: deliver
    path: ".ai/run-context/delivery-report.md"
onboarding_state_path: "styles/design-system.md"
audit_findings_path: ".ai/design/audit.md"
audit_digest_path: ".ai/design/audit-digest.txt"
authoring_examples_path: "work-item-examples"
evidence_manifest: evidence-manifest
branch_name:
  pattern: "^[a-z0-9/-]+$"
requires:
  - tool: aem-cli
    probe: [bash, <pack>/shared/scripts/check-local-cli.sh]
    install: [npm, install, --save-dev, @adobe/aem-cli]
    remedy: "add the CLI to the project's own dev dependencies before the run (npm install --save-dev @adobe/aem-cli), then commit package.json and the lock file"
hosts: ["*.aem.page"]
ignore_paths: ["drafts/"]
credential_checks:
  - check: preview-config
    probe: [bash, <pack>/shared/scripts/check-preview-config.sh]
    proves: "the config's preview host suffix and branch limit match the current origin remote; not that the host answers"
    remedy: "the repository's owner or name changed since setup: run agentic-core:setup again and choose re-detect"
  - check: preview-host
    probe: [bash, <pack>/shared/scripts/check-preview-host.sh]
    proves: "the default branch's preview host serves this repository's code; not that any page or content exists"
    remedy: "install the AEM Code Sync app (github.com/apps/aem-code-sync) on this repository's owner with this repository included, then push to the default branch"
config_derivation: "shared/scripts/derive-config.sh"
setup_skill: "eds-setup"
reference_docs: "https://developer.mozilla.org/en-US/"

name: Check plugin versions

on:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: the version check itself
        run: bash scripts/check-plugin-versions.test.sh
      - name: a changed plugin carries a new version, and the catalog follows it
        run: bash scripts/check-plugin-versions.sh "origin/${{ github.base_ref }}"

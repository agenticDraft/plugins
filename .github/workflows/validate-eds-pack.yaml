name: Validate agentic-eds pack

on:
  push:
    branches: [main]
    paths:
      - 'plugins/agentic-eds/**'
      - 'plugins/agentic-core/**'
      - 'plugins/agentic-jira/**'
      - '.github/workflows/validate-eds-pack.yaml'
  pull_request:
    paths:
      - 'plugins/agentic-eds/**'
      - 'plugins/agentic-core/**'
      - 'plugins/agentic-jira/**'
      - '.github/workflows/validate-eds-pack.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install the runner's dependencies
        run: npm ci
        working-directory: plugins/agentic-core/shared/runner
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: every agentic-eds suite
        run: bash scripts/run-tests.sh plugins/agentic-eds
      - name: every node reference in an agentic-eds skill names a heading
        run: bash plugins/agentic-core/shared/lib/validate-contracts.sh plugins/agentic-eds
      - name: every route stage writes its envelope with the emitter
        run: bash plugins/agentic-eds/shared/scripts/check-stage-envelopes.sh plugins/agentic-eds/pack.yaml plugins/agentic-eds/skills
      - name: Validate agentic-eds pack manifest
        run: bash plugins/agentic-core/shared/lib/validate-pack-manifest.sh plugins/agentic-eds/pack.yaml
      - name: Validate plugin manifest
        run: claude plugin validate plugins/agentic-eds --strict
